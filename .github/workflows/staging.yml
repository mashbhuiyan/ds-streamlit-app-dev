on:
  push:
    branches:
      - staging
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Generate Deployment Package
        run: zip -r dev-ds-streamlit-app.zip * -x "**/__pycache__/**" -x "**.git/**" -x "**.github/**"
      - name: Get Timestamp
        uses: gerred/actions/current-time@master
        id: current-time
      - name: Format Timestamp
        uses: frabert/replace-string-action@master
        id: format-time
        with:
          pattern: '[:\.]+'
          string: "${{ steps.current-time.outputs.time }}"
          replace-with: '-'
          flags: 'g'
      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v14
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: ds-streamlit-app-dev
          environment_name: ds-streamlit-app-dev-env
          version_label: "ds-streamlit-app-version-${{ github.run_number }}"
          region: us-east-2
          deployment_package: dev-ds-streamlit-app.zip
          # bucket_name: ${{ secrets.S3_BUCKET_NAME }}